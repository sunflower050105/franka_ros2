# controllers.yaml – franka_velocity_ctrl
# ----------------------------------------
# ros2_control parameter file for the Franka Research 3 (FR3) real hardware
# using a JointGroupVelocityController.
#
# The /**  wildcard makes these parameters namespace-agnostic so the file
# works with or without a ROS namespace prefix.

/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000         # Hz – must match the Franka control-loop rate
      thread_priority: 98

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
        state_interfaces:
          robot_state

      joint_velocity_controller:
        type: velocity_controllers/JointGroupVelocityController

/**:
  franka_robot_state_broadcaster:
    ros__parameters:
      # Publishing rate for convenience topics (current_pose, joint_states, etc.)
      convenience_publish_rate: 100   # Hz

/**:
  joint_velocity_controller:
    ros__parameters:
      joints:
        - fr3_joint1
        - fr3_joint2
        - fr3_joint3
        - fr3_joint4
        - fr3_joint5
        - fr3_joint6
        - fr3_joint7
      # interface_name: velocity   # default – uncomment to be explicit
